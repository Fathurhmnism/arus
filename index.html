<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Penny">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Penny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  /* v2 "Premium gelap": dasar hitam hangat, satu aksen emas, gerak hanya di momen penting. */
  --bg:#0C0D10; --ink:#F3EFE7; --paper:#13151A; --paper2:#191B21; --line:#22252C; --line2:#2C2F37;
  --muted:#8A8F98; --soft:#BFC3CA; --gold:#C9A96E; --gold2:#E2C68E;
  --good:#9CC4A8; --warn:#D9A55B; --bad:#D98C7A;
  /* alias lama (dipakai app.js) */
  --lime:var(--gold); --pink:var(--bad); --blue:var(--gold);
  --serif:"Instrument Serif", Georgia, serif;
  --font:Inter, system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(20px + env(safe-area-inset-top)) 20px calc(124px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px}
.top .d{font-size:12px;color:var(--muted);letter-spacing:.04em}
.top h1{font-family:var(--serif);font-size:30px;line-height:1.1;margin-top:2px}
.top .r{display:flex;gap:8px;align-items:center}
.box{background:var(--paper);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px}
.pill{border:1px solid var(--line2);background:var(--paper2);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13px;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.iconbtn{width:44px;height:44px;padding:0;justify-content:center}
.hero{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero .who{display:flex;align-items:center;gap:12px}
.bubble{flex:1;background:var(--paper2);color:var(--soft);border:1px solid var(--line2);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.4}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-family:var(--serif);font-size:48px;line-height:1.05}
.hero .sub{font-size:13px;color:var(--muted)}
.meter{height:4px;background:var(--line);border-radius:99px;overflow:hidden;position:relative;margin:4px 0}
.meter i{display:block;height:100%}
.meter b{position:absolute;right:0;top:-18px;font-size:11px;font-weight:500;color:var(--bad)}
.status{font-size:14px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}.tile b{font-size:17px;font-weight:600}
.chip{border:1px solid var(--line2);background:var(--paper2);color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:500;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;text-align:left;width:100%}
.chip span:last-child{color:var(--gold);font-size:13px}
.chip.calm{background:var(--paper);color:var(--soft)}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0}
.sec h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.sec a,.sec button.link{font-size:13px;color:var(--gold);background:none;border:0;padding:0;text-decoration:none}
.list{display:flex;flex-direction:column;padding:2px 16px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink)}
.list>.row:first-child{border-top:0}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#E8DCCB;letter-spacing:.02em}
.row .m{flex:1;min-width:0;display:flex;flex-direction:column}
.row .m b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .v{font-weight:500;white-space:nowrap;text-align:right}
.row .v small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.plus{color:var(--good)}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--paper2);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:500;font-size:15px;min-height:48px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#0C0D10;font-weight:600}.btn.blue{background:var(--gold);color:#0C0D10}.btn.danger{background:transparent;border-color:rgba(217,140,122,.45);color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:13px;min-height:40px;border-radius:12px}
.btn:active,.pill:active,.chip:active{opacity:.75}
.btn:disabled{opacity:.4}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar span{font-family:var(--serif);font-size:22px}
.monthbar button{width:44px;height:44px;border:1px solid var(--line2);background:var(--paper2);border-radius:50%;font-size:20px;color:var(--ink)}
.monthbar button:disabled{opacity:.3}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line2);background:transparent;color:var(--soft);border-radius:99px;padding:8px 14px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0C0D10;font-weight:600}
.day{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;padding:10px 2px 6px;letter-spacing:.02em}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%}
.note{font-size:13px;color:var(--muted);margin:0}
.big2{font-family:var(--serif);font-size:38px;line-height:1.1}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:8px;padding:2px 8px;font-size:11px;letter-spacing:.06em;color:var(--soft);background:var(--paper2)}
.inbox-card{display:flex;flex-direction:column;gap:12px}
.inbox-card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.inbox-card .amt{font-size:24px;font-weight:600;letter-spacing:-.01em}
.raw{font-size:12px;color:var(--muted);background:var(--paper2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin-top:6px}
details summary{cursor:pointer}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{border:1px solid var(--line2);background:transparent;color:var(--soft);border-radius:99px;padding:8px 14px;font-size:14px}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0C0D10;font-weight:500}
/* navigasi Liquid Glass */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:440px;margin:0 20px;margin-inline:max(20px,calc((100% - 440px)/2));height:66px;border-radius:33px;background:rgba(40,42,50,.42);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.45);display:flex;justify-content:space-around;align-items:center;padding:0 8px}
nav.tabs a{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#A9AEB7;text-decoration:none}
nav.tabs a[aria-current="page"]{background:rgba(255,255,255,.10);color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .add{width:50px;height:50px;border-radius:50%;background:var(--gold);color:#0C0D10;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
nav.tabs .add svg{width:22px;height:22px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;padding:14px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet .hd h2{font-family:var(--serif);font-size:24px}
.form{display:flex;flex-direction:column;gap:14px}
.form label,.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea,select.inp,input.inp{border:1px solid var(--line2);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;width:100%;min-width:0}
.form textarea{min-height:110px;font-size:14px}
.amtin{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line2);padding:4px 0 8px}
.amtin span{font-family:var(--serif);font-size:22px;color:var(--muted)}
.amtin input:focus,.amtin input:focus-visible{outline:none}
.amtin input{border:0 !important;padding:4px 0 !important;font-family:var(--serif);font-size:44px !important;background:none !important;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:14px;padding:4px;background:var(--paper);gap:4px}
.seg button{border:0;border-radius:10px;background:none;padding:10px 4px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0C0D10;font-weight:600}
.accs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.accs button{flex:none;border:1px solid var(--line2);background:transparent;color:var(--soft);border-radius:99px;padding:8px 14px;font-size:14px}
.accs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#0C0D10;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--paper2);color:var(--ink);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:all .25s;max-width:88%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%)}
.dialog{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.65)}
.dialog.on{display:grid}
.dialog .b{background:var(--paper);border:1px solid var(--line2);border-radius:20px;padding:20px;max-width:360px;width:100%}
.dialog p{margin:0 0 16px;line-height:1.45}
.dialog .btnrow{justify-content:flex-end}
.onb{display:flex;flex-direction:column;gap:16px}
/* dompet */
.top .hi{display:flex;align-items:center;gap:12px}
.cuki-av{width:46px;height:46px;border-radius:50%;background:var(--paper2);border:1px solid var(--line2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.wallet-stage{position:relative;margin-top:4px;overflow:hidden;padding-top:0;transition:height .5s cubic-bezier(.2,.9,.25,1.1)}
.wallet-stage .card,.wallet-stage .wallet,.wallet-stage .card-detail{position:absolute;transition:top .55s cubic-bezier(.2,.9,.25,1.12),left .45s ease,right .45s ease,opacity .3s ease}
.wallet-stage.noanim,.wallet-stage.noanim *{transition:none !important}
.card{left:0;right:0;height:206px;border-radius:16px;overflow:hidden;padding:14px 18px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:8px;text-align:left;border:1px solid var(--edge,rgba(255,255,255,.12));box-shadow:0 -6px 16px rgba(0,0,0,.5),0 18px 36px rgba(0,0,0,.4);color:var(--ink);background:var(--skin)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-name{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc,var(--gold2))}
.c-bal{font-size:13px;color:#D3D8E2}
.c-sub{display:flex;align-items:center;gap:10px}
.c-no{font-size:10px;letter-spacing:.18em;color:var(--acc,var(--gold2));opacity:.8}
.c-chip{display:none;width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,#ECD49A,#B48A43);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);flex:none}
.card.front .c-chip{display:block}
.card-detail{left:0;right:0;opacity:0;visibility:hidden;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.card-detail.on{opacity:1;visibility:visible;pointer-events:auto}
.card-detail .list{padding:0}
.wallet{left:0;right:0;height:150px;z-index:20;border-radius:22px;background:#4A2F20;background-image:radial-gradient(circle at 30% 20%,rgba(255,255,255,.07),transparent 60%),radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.2px);background-size:auto,4px 4px;box-shadow:0 -12px 26px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.wallet::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(201,169,110,.45);border-radius:16px;pointer-events:none}
.w-clasp{position:absolute;right:22px;top:22px;width:34px;height:22px;border-radius:6px;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.w-total{position:absolute;left:24px;bottom:22px;display:flex;flex-direction:column}
.w-total span{font-size:12px;color:rgba(243,239,231,.7)}
.w-total b{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;margin-top:4px}
.ew-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(76px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.ew-row::-webkit-scrollbar{display:none}
.ewc{height:118px;border-radius:12px;overflow:hidden;padding:10px 9px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--skin);border:1px solid var(--edge,rgba(255,255,255,.12));color:#E4E6EB;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.ewc .c-name{font-size:9px;letter-spacing:.16em}
.ewc .num{font-size:12px}
.ewc .c-chip{display:block;width:20px;height:15px;border-radius:3px;margin-top:auto}
.ew-wrap,#rest{display:flex;flex-direction:column;gap:12px;transition:opacity .3s ease}
.dim{opacity:0;pointer-events:none}
/* bahan kartu: dasar gelap + aksen warna bank (desain orisinal, tanpa logo) */
.skin-bca{--acc:#D6B676;--edge:rgba(214,182,118,.40);--skin:repeating-radial-gradient(circle at 92% -20%,rgba(214,182,118,.26) 0 .8px,transparent 1.2px 6px),repeating-radial-gradient(circle at 60% -60%,rgba(214,182,118,.12) 0 .8px,transparent 1.2px 8px),linear-gradient(135deg,#13284F 0%,#0A1834 45%,#050C1C 100%)}
.skin-bri{--acc:#E2C68E;--edge:rgba(201,169,110,.60);--skin:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 48%,rgba(255,255,255,0) 62%),linear-gradient(160deg,#1B3263 0%,#0F2147 55%,#0A1733 100%)}
.skin-mandiri{--acc:#E6B94A;--edge:rgba(230,185,74,.40);--skin:linear-gradient(180deg,transparent 0 19%,rgba(230,185,74,.75) 19% 20%,transparent 20% 22.5%,rgba(230,185,74,.35) 22.5% 23%,transparent 23%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),linear-gradient(150deg,#33373E 0%,#1E2126 55%,#141619 100%)}
.skin-seabank{--acc:#F09450;--edge:rgba(240,148,80,.45);--skin:radial-gradient(circle at 18% -10%,rgba(240,148,80,.30),transparent 50%),radial-gradient(circle at 90% 100%,rgba(150,170,255,.10),transparent 50%),linear-gradient(125deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.08) 46%,rgba(255,255,255,0) 60%),linear-gradient(135deg,#2A2530 0%,#1C1A22 55%,#141319 100%)}
.skin-jago{--acc:#E8A048;--edge:rgba(232,160,72,.45);--skin:linear-gradient(120deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 65%),repeating-linear-gradient(45deg,#18181A 0 3px,#212124 3px 6px)}
.skin-gopay{--acc:#6FC39A;--edge:rgba(111,195,154,.35);--skin:linear-gradient(120deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 48%,rgba(255,255,255,0) 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),linear-gradient(160deg,#16382C 0%,#0D241C 60%,#08180F 100%)}
.skin-ovo{--acc:#B9A3EE;--edge:rgba(185,163,238,.35);--skin:repeating-radial-gradient(circle at 85% 120%,rgba(185,163,238,.16) 0 .8px,transparent 1.2px 6px),linear-gradient(140deg,#2C1F4A 0%,#1A1230 60%,#110B20 100%)}
.skin-shopeepay{--acc:#F0A070;--edge:rgba(240,160,112,.35);--skin:radial-gradient(circle at 15% 0%,rgba(240,160,112,.20),transparent 55%),linear-gradient(125deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.08) 46%,rgba(255,255,255,0) 60%),linear-gradient(140deg,#43231A 0%,#2A150F 60%,#1B0D09 100%)}
.skin-dana{--acc:#8DB8F0;--edge:rgba(141,184,240,.35);--skin:repeating-linear-gradient(45deg,rgba(141,184,240,.06) 0 2px,transparent 2px 6px),linear-gradient(150deg,#14294A 0%,#0C1A32 60%,#081122 100%)}
.skin-netral{--acc:#C9CBD0;--edge:rgba(255,255,255,.14);--skin:linear-gradient(120deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.06) 48%,rgba(255,255,255,0) 62%),linear-gradient(150deg,#2A2C31 0%,#1B1D21 60%,#121316 100%)}
/* investasi */
.inv-head{display:flex;flex-direction:column;gap:4px;font-size:13px}
.inv-total{font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.chart{width:100%;height:150px;display:block}
.chart-empty{height:120px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--line2);border-radius:16px;padding:0 24px}
.seg.range button{padding:8px 2px;font-size:12px}
/* toples */
.jar-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:4px 0 8px}
.jar-hero .big2{font-size:44px}
.jar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.jar-cell{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.jar-cell .jn{font-size:11.5px;margin-top:4px;max-width:100%;padding:0 2px;text-align:center;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto}
.jar-cell .jp{font-size:11px}
.cuki-line{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.cuki-line p{margin:0;font-size:14px;color:var(--soft);line-height:1.45}
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--gold);font-size:16px;padding:6px 8px 6px 0;margin:calc(-4px) 0 -12px;min-height:44px;align-self:flex-start}
.top.sub{padding-top:0}
.link.rate{background:none;border:0;padding:4px 0 0;text-align:left;color:var(--muted);font-size:13px;align-self:flex-start}
.order .row{gap:10px}
.cb-new+.cb-new{margin-top:4px}
.ord{width:22px;color:var(--muted);font-size:13px}
.iconbtn2{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--paper2);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn2:disabled{opacity:.25}
.menu .row svg{width:22px;height:22px;color:var(--soft);flex:none}
.menu .row .go{color:var(--muted)}
@keyframes cuki-calm{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes cuki-sigh{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1px) rotate(-2deg)}}
.cuki-calm{animation:cuki-calm 4s ease-in-out infinite}
.cuki-sigh{transform-origin:50% 100%;animation:cuki-sigh 5s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
