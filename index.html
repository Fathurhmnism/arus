<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE14D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arus">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Arus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Desain C: kuning, kobalt, pink, lime, garis hitam tebal. Satu kolom ponsel, nav bawah dengan tombol + di tengah. */
  --bg:#FFE14D; --ink:#111111; --paper:#FFFFFF; --blue:#2340FF; --pink:#FF5FA2; --lime:#C6FF3D; --sky:#7DD3FC; --orange:#FDBA74;
  --muted:#333333; --line:#111111; --good:#D9FF6B; --warn:#FFD08A; --bad:#FFC2DA;
  --font:"Space Grotesk", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(18px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .d{font-size:13px;font-weight:600;text-transform:uppercase}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05;text-transform:uppercase}
.top .r{display:flex;gap:8px;align-items:center}
.box{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line)}
.pad{padding:14px}
.pill{border:2.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--line);min-height:44px;display:inline-flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;padding:0;justify-content:center}
.hero{background:var(--blue);color:#fff;border:2.5px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:8px}
.hero .who{display:flex;align-items:center;gap:12px}
.bubble{flex:1;background:#fff;color:var(--ink);border:2.5px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.3}
.hero .lbl{font-size:14px;font-weight:600}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1}
.hero .sub{font-size:13px;font-weight:500}
.meter{height:14px;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-right:2px solid var(--line)}
.meter b{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;line-height:1}
.status{font-size:15px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column}
.tile span{font-size:12px;font-weight:600}.tile b{font-size:17px}
.chip{border:2.5px solid var(--line);background:var(--pink);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;text-align:left;width:100%}
.chip.calm{background:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:2px}
.sec h2{font-size:18px;font-weight:700;text-transform:uppercase}
.sec a,.sec button.link{font-size:13px;font-weight:700;color:var(--ink);background:none;border:0;padding:0}
.list{display:flex;flex-direction:column;padding:2px 14px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list>.row:first-child{border-top:0}
.av{width:38px;height:38px;flex:none;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.row .m{flex:1;min-width:0;display:flex;flex-direction:column}
.row .m b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:700;white-space:nowrap;text-align:right}
.row .v small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.plus{color:#0F7A3A}
.empty{padding:22px 10px;text-align:center;font-weight:600}
.btn{border:2.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--line);min-height:48px}
.btn.pri{background:var(--lime)}.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;min-height:40px;border-radius:11px;box-shadow:2px 2px 0 var(--line)}
.btn:active,.pill:active,.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar span{font-weight:700;font-size:16px;text-transform:uppercase}
.monthbar button{width:44px;height:44px;border:2.5px solid var(--line);background:#fff;border-radius:12px;font-size:20px;font-weight:700;box-shadow:2px 2px 0 var(--line)}
.monthbar button:disabled{opacity:.35}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{font-size:12.5px;font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;padding:8px 2px 4px}
.bar{height:12px;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%}
.note{font-size:13px;font-weight:500;margin:0}
.big2{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.tag{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:700;background:#fff}
.inbox-card{display:flex;flex-direction:column;gap:10px}
.inbox-card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.inbox-card .amt{font-size:24px;font-weight:700;letter-spacing:-.02em}
.raw{font-size:12px;font-weight:500;color:var(--muted);background:#F4F4F4;border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;font-size:13px;font-weight:700}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;height:68px}
nav.tabs a{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-decoration:none;min-height:48px;text-transform:uppercase}
nav.tabs a[aria-current="page"]{color:var(--bg)}
nav.tabs .add{width:56px;height:56px;margin:-30px auto 0;border:2.5px solid #fff;background:var(--lime);color:var(--ink);border-radius:16px;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--bg);border:2.5px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;padding:12px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .hd h2{font-size:20px;font-weight:700;text-transform:uppercase}
.form{display:flex;flex-direction:column;gap:12px}
.form label,.lab{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.form input,.form select,.form textarea{border:2.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600;width:100%;min-width:0}
.form textarea{min-height:110px;font-size:14px}
.amtin{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:3px 3px 0 var(--line)}
.amtin span{font-size:22px;font-weight:700}
.amtin input{border:0 !important;padding:6px 0 !important;font-size:34px !important;font-weight:700 !important;background:none !important;letter-spacing:-.02em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:0;border-left:2px solid var(--line);background:none;padding:10px 4px;font-weight:700;font-size:14px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.accs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.accs button{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700}
.accs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#B0001E;font-size:13px;font-weight:700;margin:0;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:all .2s;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.dialog{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.5)}
.dialog.on{display:grid}
.dialog .b{background:#fff;border:2.5px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);padding:18px;max-width:360px;width:100%}
.dialog p{margin:0 0 14px;font-weight:600}
.dialog .btnrow{justify-content:flex-end}
.onb{display:flex;flex-direction:column;gap:14px}
@keyframes cuki-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cuki-twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes cuki-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes cuki-drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(18px);opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes cuki-soul{0%{transform:translateY(10px);opacity:0}25%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes cuki-wobble{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-6deg)}}
.cuki-bounce{animation:cuki-bounce 1.1s ease-in-out infinite}
.cuki-spark{transform-box:fill-box;transform-origin:center;animation:cuki-twinkle 1.4s ease-in-out infinite}
.cuki-spark.d2{animation-delay:.45s}.cuki-spark.d3{animation-delay:.9s}
.cuki-shake{animation:cuki-shake .9s ease-in-out infinite}
.cuki-drip{animation:cuki-drip 1.3s ease-in infinite}.cuki-drip.d2{animation-delay:.65s}
.cuki-soul{animation:cuki-soul 2.2s ease-out infinite}
.cuki-body{transform-box:fill-box;transform-origin:50% 100%;animation:cuki-wobble 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="app" id="main" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigasi utama"><div class="in">
  <a href="#beranda" data-v="beranda">Beranda</a>
  <a href="#riwayat" data-v="riwayat">Riwayat</a>
  <a href="#" data-act="tx-new" aria-label="Catat transaksi"><span class="add">+</span></a>
  <a href="#aset" data-v="aset">Aset</a>
  <a href="#budget" data-v="budget">Budget</a>
</div></nav>
<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dialog" id="dialog" role="alertdialog" aria-modal="true"><div class="b"><p id="dlgMsg"></p><div class="btnrow"><button class="btn sm" id="dlgNo">Batal</button><button class="btn sm pri" id="dlgYes">Ya</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
